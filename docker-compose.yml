services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: floy_backend:latest
    restart: always
    container_name: floy_backend
    volumes:
      - .:/app
      - ./volumes/static:/static/
    env_file:
      - .env
    entrypoint: python3 manage.py
    command: runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    networks:
      floy_network:
        ipv4_address: 172.20.0.5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  db:
    image: docker.arvancloud.ir/postgres:15
    restart: always
    container_name: floy_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      # PostgreSQL memory optimization
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_WORK_MEM: 4MB
      POSTGRES_MAINTENANCE_WORK_MEM: 64MB
      POSTGRES_MAX_CONNECTIONS: 100
      POSTGRES_WAL_BUFFERS: 16MB
      POSTGRES_CHECKPOINT_SEGMENTS: 32
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: 0.9
    ports:
      - "5432:5432"
    networks:
      floy_network:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.arvancloud.ir/redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      floy_network:
        ipv4_address: 172.20.0.3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: docker.arvancloud.ir/minio/minio:RELEASE.2023-11-01T01-57-10Z-cpuv1
    container_name: floy_minio
    restart: always
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9000
      MINIO_SERVER_URL: http://localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      floy_network:
        ipv4_address: 172.20.0.7
    command: server /data --console-address ":9001" --address ":9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  celery-beat-three-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: floy_backend:latest
    container_name: celery-beat-three-1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - .:/app
      - celerybeat_data_three_1:/app/celerybeat-data
    entrypoint: celery -A runner.schedule.celery
    command: worker --beat --loglevel=INFO --concurrency=1
    env_file:
      - .env
    environment:
      - BEAT_ROLE=three_days
      - BEAT_SCHEDULE_FILE=/app/celerybeat-data/celerybeat-schedule
      - C_FORCE_ROOT=true
      - PYTHONUNBUFFERED=1
      # CRAWL_ROUTES_THREE_1: JSON array of routes to crawl, e.g., [["THR", "AWZ"], ["IKA", "DXB"]]
      # Leave empty to crawl all routes. Can be overridden in .env file
      - CRAWL_ROUTES_THREE_1=${CRAWL_ROUTES_THREE_1:-}
    networks:
      floy_network:
        ipv4_address: 172.20.0.6
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-beat-three-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: floy_backend:latest
    container_name: celery-beat-three-2
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - .:/app
      - celerybeat_data_three_2:/app/celerybeat-data
    entrypoint: celery -A runner.schedule.celery
    command: worker --beat --loglevel=INFO --concurrency=1
    env_file:
      - .env
    environment:
      - BEAT_ROLE=three_days
      - BEAT_SCHEDULE_FILE=/app/celerybeat-data/celerybeat-schedule
      - C_FORCE_ROOT=true
      - PYTHONUNBUFFERED=1
      # CRAWL_ROUTES_THREE_2: JSON array of routes to crawl, e.g., [["THR", "AWZ"], ["IKA", "DXB"]]
      # Leave empty to crawl all routes. Can be overridden in .env file
      - CRAWL_ROUTES_THREE_2=${CRAWL_ROUTES_THREE_2:-}
    networks:
      floy_network:
        ipv4_address: 172.20.0.9
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-beat-four-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: floy_backend:latest
    container_name: celery-beat-four-1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - .:/app
      - celerybeat_data_four_1:/app/celerybeat-data
    entrypoint: celery -A runner.schedule.celery
    command: worker --beat --loglevel=INFO --concurrency=2 --max-tasks-per-child=1000 --max-memory-per-child=512000
    env_file:
      - .env
    environment:
      - BEAT_ROLE=four_plus
      - BEAT_SCHEDULE_FILE=/app/celerybeat-data/celerybeat-schedule
      - C_FORCE_ROOT=true
      - PYTHONUNBUFFERED=1
      # CRAWL_ROUTES_FOUR_1: JSON array of routes to crawl, e.g., [["THR", "AWZ"], ["IKA", "DXB"]]
      # Leave empty to crawl all routes
      - CRAWL_ROUTES_FOUR_1=
    networks:
      floy_network:
        ipv4_address: 172.20.0.8
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: docker.arvancloud.ir/rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      floy_network:
        ipv4_address: 172.20.0.4
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

volumes:
  pgdata:
  minio_data:
  redis_data:
  celerybeat_data_three_1:
  celerybeat_data_three_2:
  celerybeat_data_four_1:

networks:
  floy_network:
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
