services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: floy_backend:latest
    restart: always
    container_name: floy_backend
    volumes:
      - .:/app
      - ./volumes/static:/static/
    env_file:
      - .env
    entrypoint: python3 manage.py
    command: runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - minio

  db:
    image: docker.arvancloud.ir/postgres:15
    restart: always
    container_name: floy_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "5432:5432"

  redis:
    image: docker.arvancloud.ir/redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: docker.arvancloud.ir/minio/minio:RELEASE.2023-11-01T01-57-10Z-cpuv1
    container_name: floy_minio
    restart: always
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9000
      MINIO_SERVER_URL: http://localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001" --address ":9000"

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: floy_backend:latest
    container_name: celery-beat
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - .:/app
    entrypoint: celery -A runner.schedule.celery
    command: worker --beat --loglevel=DEBUG
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - rabbitmq

  rabbitmq:
    image: docker.arvancloud.ir/rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

volumes:
  pgdata:
  minio_data:
  redis_data:
